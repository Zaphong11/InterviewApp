version: '3.8'

services:
  backend:
    build: ./backend
    container_name: interview_app_backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      # Add other environment variables as needed
    volumes:
      - ./backend/uploads:/app/uploads # Persist uploads
    restart: always

  frontend:
    build: ./frontend
    container_name: interview_app_frontend_builder

    # This container just builds and exits, but we need the volume populated.
    # Actually, standard practice for static files is often a multi-stage build in Nginx container
    # OR using a builder container to populate a volume.
    # Let's use the builder pattern: run build, then exit.
    command: sh -c "npm run build && cp -r dist/* /shared_dist/"
    volumes:
      - ./frontend:/app
      - frontend_build:/shared_dist

  nginx:
    image: nginx:alpine
    container_name: interview_app_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_build:/usr/share/nginx/html # Mount shared build files
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  frontend_build:

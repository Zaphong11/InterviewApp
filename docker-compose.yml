services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview_app_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Ensure database migrations run before starting the app (optional but recommended)
    # command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interview_app_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

# We don't need a db service as the user is using RDS
